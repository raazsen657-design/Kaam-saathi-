<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaamSaathi — Find Trusted Local Workers</title>

<!-- PWA setup: makes the app installable to a phone home screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A41">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KaamSaathi">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ============================================================
   DESIGN TOKENS — change colors/fonts here, everything updates
   ============================================================ */
:root{
  --ink:#1B2A41; --blue:#2F5D8A; --blue-dark:#254A6E;
  --amber:#F0A202; --amber-dark:#C77F00;
  --paper:#F7F5F0; --card:#FFFFFF; --slate:#5C6B73; --line:#E3DFD6;
  --verified:#2E8B57; --danger:#B3402A; --radius:14px;
  --font-display:'Oswald', sans-serif;
  --font-body:'Source Sans 3', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
img,svg{display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
.app-nav{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;border-bottom:3px solid var(--amber);}
.app-nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
.brand{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block;}
.nav-links{display:flex;gap:22px;font-size:15px;font-weight:500;}
.nav-links a{opacity:.85;padding:6px 2px;border-bottom:2px solid transparent;}
.nav-links a:hover, .nav-links a.active{opacity:1;border-color:var(--amber);}

main{min-height:70vh;}
footer{padding:40px 0 60px;color:var(--slate);font-size:13px;border-top:1px solid var(--line);margin-top:60px;}
.footer-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:18px;}
.footer-links{display:flex;gap:18px;flex-wrap:wrap;}
.footer-links a{color:var(--ink);font-weight:600;}
.footer-links a:hover{color:var(--blue);}

.hero{background:radial-gradient(1200px 500px at 85% -10%, rgba(240,162,2,.14), transparent 60%), var(--ink);color:#fff;padding:64px 0 46px;}
.hero h1{font-family:var(--font-display);font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0 0 14px;font-weight:600;letter-spacing:.3px;}
.hero h1 em{font-style:normal;color:var(--amber);}
.hero p{max-width:520px;color:#D9DEE6;font-size:16.5px;margin:0 0 28px;}

.search-panel{background:var(--card);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);}
.search-panel input, .search-panel select{font-family:var(--font-body);font-size:15px;padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;}
.btn{border:none;border-radius:9px;padding:12px 20px;font-weight:600;font-size:15px;font-family:var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, background .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-amber{background:var(--amber);color:#241800;}
.btn-amber:hover{background:var(--amber-dark);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-block{width:100%;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
@media (max-width:640px){.search-panel{grid-template-columns:1fr;}}

.cat-strip{padding:26px 0 8px;}
.cat-strip h2, .section-title{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 0 16px;display:flex;align-items:center;gap:10px;}
.cat-strip h2::before, .section-title::before{content:"";width:6px;height:20px;background:var(--amber);border-radius:2px;display:inline-block;}
.cat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
.cat-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);}
.cat-btn svg{width:26px;height:26px;stroke:var(--blue);}
.cat-btn:hover{border-color:var(--blue);transform:translateY(-2px);}

.directory{padding:34px 0 20px;}
.dir-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px;}
.dir-toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;}
.dir-toolbar select, .dir-toolbar input{padding:9px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;background:#fff;}
.result-count{font-family:var(--font-mono);font-size:12.5px;color:var(--slate);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;}

.worker-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .18s ease, transform .18s ease;}
.worker-card:hover{box-shadow:0 16px 30px -18px rgba(27,42,65,.35);transform:translateY(-3px);}
.worker-card::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--paper);border:1px solid var(--line);}
.worker-card.premium{border-color:var(--amber);}
.worker-card.premium::after{content:"PREMIUM";position:absolute;top:14px;right:-30px;background:var(--amber);color:#241800;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:1px;padding:3px 34px;transform:rotate(40deg);box-shadow:0 2px 6px rgba(0,0,0,.15);}
.wc-top{display:flex;gap:12px;align-items:center;}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:18px;font-weight:600;flex-shrink:0;}
.wc-name{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.15;}
.wc-trade{font-size:13px;color:var(--blue);font-weight:600;}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
.badge{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.3px;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;}
.badge-verified{background:#E4F3EA;color:var(--verified);}
.badge-premium{background:#FCEFD2;color:var(--amber-dark);}
.badge-new{background:#E7EEF6;color:var(--blue);}
.wc-meta{font-size:13px;color:var(--slate);display:flex;align-items:center;gap:6px;}
.stars{color:var(--amber);font-size:14px;letter-spacing:1px;}
.rating-num{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);font-weight:600;}
.review-count{font-size:12px;color:var(--slate);}
.wc-bio{font-size:13.5px;color:var(--slate);line-height:1.45;flex-grow:1;}
.wc-actions{display:flex;gap:8px;margin-top:4px;}
.wc-actions .btn{flex:1;padding:9px 10px;font-size:13.5px;}
.dashed-divider{border:none;border-top:1px dashed var(--line);margin:2px 0;}
.empty-state{text-align:center;padding:60px 20px;color:var(--slate);}
.empty-state h3{font-family:var(--font-display);color:var(--ink);font-size:20px;margin-bottom:6px;}

.detail-header{background:var(--ink);color:#fff;padding:40px 0 34px;}
.back-link{font-size:13.5px;color:#C9D2DE;display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;}
.detail-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.avatar-lg{width:78px;height:78px;font-size:26px;background:#26456B;border:2px solid var(--amber);}
.detail-name{font-family:var(--font-display);font-size:30px;font-weight:600;}
.detail-trade{color:var(--amber);font-weight:600;font-size:14.5px;}
.detail-body{padding:34px 0 10px;display:grid;grid-template-columns:1.5fr 1fr;gap:32px;}
@media (max-width:800px){.detail-body{grid-template-columns:1fr;}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.panel + .panel{margin-top:20px;}
.contact-box{position:sticky;top:80px;}
.contact-row{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line);}
.contact-row:last-child{border-bottom:none;}
.contact-row span:first-child{color:var(--slate);}
.contact-row span:last-child{font-weight:600;font-family:var(--font-mono);font-size:13px;}

.review{padding:16px 0;border-bottom:1px solid var(--line);}
.review:last-child{border-bottom:none;}
.review-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.reviewer{font-weight:600;font-size:14.5px;}
.review-date{font-size:12px;color:var(--slate);font-family:var(--font-mono);}
.review-text{font-size:14px;color:#3A4756;line-height:1.5;}
.review-form label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
.review-form input, .review-form textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-family:inherit;}
.review-form textarea{resize:vertical;min-height:80px;}
.star-picker{display:flex;gap:4px;font-size:26px;color:#D8D2C4;cursor:pointer;}
.star-picker span.filled{color:var(--amber);}
.form-note{font-size:12px;color:var(--slate);margin-top:10px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--danger);}

/* static/info page styles (about, privacy, terms) */
.info-page{padding:50px 0 20px;}
.info-page h1{font-family:var(--font-display);font-size:34px;margin:0 0 6px;}
.info-page .updated{font-family:var(--font-mono);font-size:12px;color:var(--slate);margin-bottom:28px;display:block;}
.info-page h2{font-family:var(--font-display);font-size:19px;margin:28px 0 8px;}
.info-page p, .info-page li{font-size:15px;line-height:1.65;color:#3A4756;}
.info-page ul{padding-left:20px;}
.info-page .lede{font-size:17px;color:var(--ink);max-width:620px;}
.contact-form{max-width:520px;}
.spinner{text-align:center;padding:60px 0;color:var(--slate);font-family:var(--font-mono);font-size:13px;}
.hidden{display:none !important;}
</style>
</head>
<body>

<nav class="app-nav">
  <div class="wrap">
    <a href="#/" class="brand"><span class="dot"></span>KaamSaathi</a>
    <div class="nav-links">
      <a href="#/" data-route="/">Home</a>
      <a href="#/directory" data-route="/directory">Find Workers</a>
      <a href="#/about" data-route="/about">About</a>
      <a href="#/contact" data-route="/contact">Contact</a>
    </div>
  </div>
</nav>

<main id="app"><div class="spinner">Loading…</div></main>

<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div>KaamSaathi — a directory built for local workers and the people who need them.</div>
      <div class="footer-links">
        <a href="#/about">About Us</a>
        <a href="#/contact">Contact Us</a>
        <a href="#/privacy">Privacy Policy</a>
        <a href="#/terms">Terms of Service</a>
      </div>
    </div>
    &copy; 2026 KaamSaathi. All rights reserved.
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   BACKEND CONNECTION
   Point this at your deployed server (see server/README.md).
   Leave as localhost while developing locally.
   ============================================================ */
const API_BASE = "http://localhost:4000";

/* ============================================================
   EDITABLE CONFIG — CATEGORIES
   ============================================================ */
const CATEGORIES = [
  { key:"electrician", label:"Electrician", icon:"bolt" },
  { key:"plumber",     label:"Plumber",     icon:"wrench" },
  { key:"carpenter",   label:"Carpenter",   icon:"hammer" },
  { key:"painter",     label:"Painter",     icon:"roller" },
  { key:"mason",       label:"Mason",       icon:"trowel" },
  { key:"ac_repair",   label:"AC Repair",   icon:"snow" },
  { key:"mechanic",    label:"Mechanic",    icon:"gear" },
  { key:"cleaner",     label:"Cleaner",     icon:"broom" },
];

/* ============================================================
   EDITABLE CONFIG — BADGES
   ============================================================ */
const BADGES = {
  verified: { label:"Verified",  className:"badge-verified", icon:"✓" },
  premium:  { label:"Premium",   className:"badge-premium",  icon:"★" },
  new:      { label:"New",       className:"badge-new",      icon:"•" },
};
function getBadges(worker){
  const list = [];
  if (worker.verified) list.push(BADGES.verified);
  if (worker.premium)  list.push(BADGES.premium);
  if (worker.isNew)    list.push(BADGES.new);
  return list;
}

const ICONS = {
  bolt:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>`,
  wrench:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2-2 2.8-2.8z"/></svg>`,
  hammer:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12l6 6-3 3-6-6M4 15l6-6 3 3-6 6-3-3zM13 9l3-3 4 4-3 3z"/></svg>`,
  roller:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="12" height="6" rx="1"/><path d="M9 11v4M9 15h4v5H9z"/></svg>`,
  trowel:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 14 10a3 3 0 1 0-4-4L1 17M17 3l4 4-3 3-4-4z"/></svg>`,
  snow:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1M2 12h20M6 6l3 1M18 6l-3 1M6 18l3-1M18 18l-3-1"/></svg>`,
  gear:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.4-2-3.4-2.3.8a7 7 0 0 0-2.8-1.6L13.3 2h-4l-.4 2.8a7 7 0 0 0-2.8 1.6l-2.3-.8-2 3.4 2 1.4A7 7 0 0 0 3.6 12c0 .5 0 1 .2 1.6l-2 1.4 2 3.4 2.3-.8a7 7 0 0 0 2.8 1.6l.4 2.8h4l.4-2.8a7 7 0 0 0 2.8-1.6l2.3.8 2-3.4-2-1.4c.1-.5.2-1 .2-1.6z"/></svg>`,
  broom:`<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 10 14M13 3l8 8-3 3-8-8zM4 21l4-8 4 4-8 4z"/></svg>`,
};

/* ============================================================
   STATE + API HELPERS
   ============================================================ */
let state = { search:"", trade:"", area:"", sort:"top" };
let cachedWorkers = []; // last successful fetch, used for the areas() dropdown etc.
let apiError = null;

async function apiGet(path){
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || `Request failed (${res.status})`);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(`${API_BASE}${path}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || `Request failed (${res.status})`);
  return res.json();
}

function tradeLabel(key){ const c = CATEGORIES.find(c=>c.key===key); return c ? c.label : key; }
function areas(){ return [...new Set(cachedWorkers.map(w=>w.area))].sort(); }
function starString(n){ const full = Math.round(n); return "★★★★★".slice(0,full) + "☆☆☆☆☆".slice(0, 5-full); }
function initials(name){ return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }
function showToast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ============================================================
   RENDER: worker card
   ============================================================ */
function workerCardHTML(w){
  const badges = getBadges(w).map(b=>`<span class="badge ${b.className}">${b.icon} ${b.label}</span>`).join("");
  return `
  <div class="worker-card ${w.premium?'premium':''}">
    <div class="wc-top">
      <div class="avatar">${initials(w.name)}</div>
      <div>
        <div class="wc-name">${w.name}</div>
        <div class="wc-trade">${tradeLabel(w.trade)} · ${w.area}</div>
      </div>
    </div>
    <div class="badge-row">${badges}</div>
    <div class="wc-meta">
      <span class="stars">${w.reviewCount ? starString(w.rating) : "☆☆☆☆☆"}</span>
      <span class="rating-num">${w.reviewCount ? w.rating.toFixed(1) : "—"}</span>
      <span class="review-count">(${w.reviewCount} review${w.reviewCount===1?'':'s'})</span>
    </div>
    <div class="wc-bio">${w.bio}</div>
    <hr class="dashed-divider">
    <div class="wc-actions">
      <a class="btn btn-primary" href="#/worker/${w.id}">View profile</a>
      <a class="btn btn-ghost" href="tel:${w.phone.replace(/\s/g,'')}">Call</a>
    </div>
  </div>`;
}

/* ============================================================
   RENDER: HOME
   ============================================================ */
function renderHome(){
  const top = [...cachedWorkers].sort((a,b)=> (b.premium-a.premium) || (b.rating-a.rating)).slice(0,4);
  return `
  <section class="hero">
    <div class="wrap">
      <h1>Find <em>trusted</em> local workers,<br>right around the corner.</h1>
      <p>Browse verified electricians, plumbers, carpenters and more in your area. Real ratings, real reviews, direct contact — no middleman.</p>
      <div class="search-panel">
        <input id="home-search" type="text" placeholder="Search by name or trade, e.g. Electrician">
        <select id="home-area">
          <option value="">All areas</option>
          ${areas().map(a=>`<option value="${a}">${a}</option>`).join("")}
        </select>
        <button class="btn btn-amber" id="home-search-btn">Search</button>
      </div>
    </div>
  </section>
  <section class="cat-strip">
    <div class="wrap">
      <h2>Browse by trade</h2>
      <div class="cat-row">
        ${CATEGORIES.map(c=>`<button class="cat-btn" data-trade="${c.key}">${ICONS[c.icon]}<span>${c.label}</span></button>`).join("")}
      </div>
    </div>
  </section>
  <section class="directory">
    <div class="wrap">
      <h2 class="section-title">Top rated near you</h2>
      <div class="card-grid">${top.map(workerCardHTML).join("")}</div>
    </div>
  </section>`;
}
function attachHomeEvents(){
  document.getElementById("home-search-btn").addEventListener("click", ()=>{
    state.search = document.getElementById("home-search").value.trim();
    state.area = document.getElementById("home-area").value;
    location.hash = "#/directory";
  });
  document.getElementById("home-search").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("home-search-btn").click(); });
  document.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.trade = btn.dataset.trade; state.search=""; state.area="";
      location.hash = "#/directory";
    });
  });
}

/* ============================================================
   RENDER: DIRECTORY
   ============================================================ */
function renderDirectory(){
  let list = cachedWorkers.filter(w=>{
    const q = state.search.toLowerCase();
    const matchesSearch = !q || w.name.toLowerCase().includes(q) || tradeLabel(w.trade).toLowerCase().includes(q);
    const matchesTrade = !state.trade || w.trade === state.trade;
    const matchesArea = !state.area || w.area === state.area;
    return matchesSearch && matchesTrade && matchesArea;
  });
  if(state.sort==="top") list.sort((a,b)=> (b.premium-a.premium) || (b.rating-a.rating));
  if(state.sort==="reviews") list.sort((a,b)=> b.reviewCount - a.reviewCount);
  if(state.sort==="az") list.sort((a,b)=> a.name.localeCompare(b.name));

  return `
  <section class="directory">
    <div class="wrap">
      <h2 class="section-title">Find workers</h2>
      <div class="dir-toolbar">
        <div class="filters">
          <input id="f-search" type="text" placeholder="Search name or trade" value="${state.search}">
          <select id="f-trade">
            <option value="">All trades</option>
            ${CATEGORIES.map(c=>`<option value="${c.key}" ${state.trade===c.key?'selected':''}>${c.label}</option>`).join("")}
          </select>
          <select id="f-area">
            <option value="">All areas</option>
            ${areas().map(a=>`<option value="${a}" ${state.area===a?'selected':''}>${a}</option>`).join("")}
          </select>
          <select id="f-sort">
            <option value="top" ${state.sort==='top'?'selected':''}>Top rated first</option>
            <option value="reviews" ${state.sort==='reviews'?'selected':''}>Most reviewed</option>
            <option value="az" ${state.sort==='az'?'selected':''}>Name A–Z</option>
          </select>
        </div>
        <div class="result-count">${list.length} worker${list.length===1?'':'s'} found</div>
      </div>
      ${list.length ? `<div class="card-grid">${list.map(workerCardHTML).join("")}</div>` : `<div class="empty-state"><h3>No workers match yet</h3><p>Try a different trade, area, or clear your search.</p></div>`}
    </div>
  </section>`;
}
function attachDirectoryEvents(){
  const apply = ()=>{
    state.search = document.getElementById("f-search").value.trim();
    state.trade = document.getElementById("f-trade").value;
    state.area = document.getElementById("f-area").value;
    state.sort = document.getElementById("f-sort").value;
    paint();
  };
  document.getElementById("f-search").addEventListener("keydown", e=>{ if(e.key==="Enter") apply(); });
  document.getElementById("f-trade").addEventListener("change", apply);
  document.getElementById("f-area").addEventListener("change", apply);
  document.getElementById("f-sort").addEventListener("change", apply);
}

/* ============================================================
   RENDER: WORKER DETAIL
   ============================================================ */
let selectedStar = 0;

async function renderDetailInto(id){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="spinner">Loading worker…</div>`;
  let w;
  try{
    w = await apiGet(`/api/workers/${id}`);
  }catch(err){
    app.innerHTML = `<div class="wrap" style="padding:60px 0"><div class="empty-state"><h3>Couldn't load this worker</h3><p>${err.message}</p><a href="#/directory" class="btn btn-primary">Back to directory</a></div></div>`;
    return;
  }

  const badges = getBadges(w).map(b=>`<span class="badge ${b.className}">${b.icon} ${b.label}</span>`).join("");
  const waNumber = w.phone.replace(/[^0-9]/g,'');

  app.innerHTML = `
  <section class="detail-header">
    <div class="wrap">
      <a href="#/directory" class="back-link">&larr; Back to directory</a>
      <div class="detail-top">
        <div class="avatar avatar-lg">${initials(w.name)}</div>
        <div>
          <div class="detail-name">${w.name}</div>
          <div class="detail-trade">${tradeLabel(w.trade)} · ${w.area}</div>
          <div class="badge-row" style="margin-top:8px">${badges}</div>
        </div>
      </div>
    </div>
  </section>
  <section class="detail-body wrap">
    <div>
      <div class="panel">
        <h2 class="section-title" style="margin-bottom:10px">About</h2>
        <p style="color:#3A4756;line-height:1.55">${w.bio}</p>
      </div>
      <div class="panel">
        <h2 class="section-title">Reviews (${w.reviewCount})</h2>
        <div class="wc-meta" style="margin-bottom:14px">
          <span class="stars">${w.reviewCount ? starString(w.rating) : "☆☆☆☆☆"}</span>
          <span class="rating-num">${w.reviewCount ? w.rating.toFixed(1) : "No ratings yet"}</span>
        </div>
        <div id="review-list">
          ${w.reviews.length ? w.reviews.slice().reverse().map(r=>`
            <div class="review">
              <div class="review-top"><span class="reviewer">${r.name}</span><span class="review-date">${r.date}</span></div>
              <div class="stars" style="font-size:13px">${starString(r.rating)}</div>
              <div class="review-text">${r.comment}</div>
            </div>`).join("") : `<p style="color:var(--slate);font-size:14px">No reviews yet — be the first to leave feedback.</p>`}
        </div>
        <hr class="dashed-divider" style="margin:20px 0">
        <h3 style="font-family:var(--font-display);font-size:16px;margin-bottom:4px">Leave a review</h3>
        <div class="review-form">
          <label>Your rating</label>
          <div class="star-picker" id="star-picker">${[1,2,3,4,5].map(n=>`<span data-val="${n}">★</span>`).join("")}</div>
          <label for="rev-name">Your name</label>
          <input id="rev-name" type="text" placeholder="e.g. Priya S.">
          <label for="rev-text">Comment</label>
          <textarea id="rev-text" placeholder="How was the work?"></textarea>
          <button class="btn btn-primary btn-block" id="rev-submit" style="margin-top:14px">Submit review</button>
          <p class="form-note">Reviews are saved to the server and visible to everyone.</p>
        </div>
      </div>
    </div>
    <div>
      <div class="panel contact-box">
        <h2 class="section-title">Contact</h2>
        <div class="contact-row"><span>Phone</span><span>${w.phone}</span></div>
        <div class="contact-row"><span>Area served</span><span>${w.area}</span></div>
        <div class="contact-row"><span>Trade</span><span>${tradeLabel(w.trade)}</span></div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
          <a class="btn btn-primary btn-block" href="tel:${w.phone.replace(/\s/g,'')}">Call now</a>
          <a class="btn btn-amber btn-block" target="_blank" href="https://wa.me/${waNumber}">Message on WhatsApp</a>
        </div>
      </div>
    </div>
  </section>`;

  selectedStar = 0;
  document.querySelectorAll("#star-picker span").forEach(star=>{
    star.addEventListener("click", ()=>{
      selectedStar = parseInt(star.dataset.val);
      document.querySelectorAll("#star-picker span").forEach(s=> s.classList.toggle("filled", parseInt(s.dataset.val) <= selectedStar));
    });
  });

  document.getElementById("rev-submit").addEventListener("click", async ()=>{
    const name = document.getElementById("rev-name").value.trim();
    const comment = document.getElementById("rev-text").value.trim();
    if(!selectedStar){ showToast("Please select a star rating.", true); return; }
    if(!name || !comment){ showToast("Please add your name and a comment.", true); return; }

    const btn = document.getElementById("rev-submit");
    btn.disabled = true; btn.textContent = "Submitting…";
    try{
      await apiPost(`/api/workers/${id}/reviews`, { name, rating:selectedStar, comment });
      showToast("Thanks — your review has been saved!");
      renderDetailInto(id); // reload with fresh data from server
    }catch(err){
      showToast(err.message || "Couldn't submit review.", true);
      btn.disabled = false; btn.textContent = "Submit review";
    }
  });
}

/* ============================================================
   RENDER: CONTACT (form posts to backend)
   ============================================================ */
function renderContact(){
  return `
  <section class="info-page wrap">
    <h1>Contact Us</h1>
    <p class="lede">Question, feedback, or want your business listed? Send a message and we'll get back to you.</p>
    <div class="panel contact-form" style="margin-top:24px">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Your name</label>
      <input id="c-name" type="text" placeholder="Full name" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;margin-bottom:14px">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Email</label>
      <input id="c-email" type="email" placeholder="you@example.com" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;margin-bottom:14px">
      <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Message</label>
      <textarea id="c-message" placeholder="How can we help?" style="width:100%;min-height:110px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-family:inherit;margin-bottom:16px"></textarea>
      <button class="btn btn-primary btn-block" id="c-submit">Send message</button>
    </div>
  </section>`;
}
function attachContactEvents(){
  document.getElementById("c-submit").addEventListener("click", async ()=>{
    const name = document.getElementById("c-name").value.trim();
    const email = document.getElementById("c-email").value.trim();
    const message = document.getElementById("c-message").value.trim();
    if(!name || !email || !message){ showToast("Please fill in every field.", true); return; }

    const btn = document.getElementById("c-submit");
    btn.disabled = true; btn.textContent = "Sending…";
    try{
      await apiPost("/api/contact", { name, email, message });
      showToast("Message sent — thanks for reaching out!");
      document.getElementById("c-name").value = "";
      document.getElementById("c-email").value = "";
      document.getElementById("c-message").value = "";
    }catch(err){
      showToast(err.message || "Couldn't send message.", true);
    }
    btn.disabled = false; btn.textContent = "Send message";
  });
}

/* ============================================================
   ROUTER
   ============================================================ */
function paint(){
  const app = document.getElementById("app");
  const hash = location.hash || "#/";
  const parts = hash.replace("#/","").split("/").filter(Boolean);
  document.querySelectorAll(".nav-links a").forEach(a=>a.classList.remove("active"));

  if(parts[0] === "worker" && parts[1]){
    renderDetailInto(parts[1]);
    return;
  }
  if(parts[0] === "directory"){
    document.querySelector('[data-route="/directory"]').classList.add("active");
    app.innerHTML = renderDirectory(); attachDirectoryEvents();
  } else if(parts[0] === "about"){
    document.querySelector('[data-route="/about"]').classList.add("active");
    app.innerHTML = renderAbout();
  } else if(parts[0] === "contact"){
    document.querySelector('[data-route="/contact"]').classList.add("active");
    app.innerHTML = renderContact(); attachContactEvents();
  } else if(parts[0] === "privacy"){
    app.innerHTML = renderPrivacy();
  } else if(parts[0] === "terms"){
    app.innerHTML = renderTerms();
  } else {
    document.querySelector('[data-route="/"]').classList.add("active");
    app.innerHTML = renderHome(); attachHomeEvents();
  }
  window.scrollTo({top:0, behavior:"instant"});
}

async function boot(){
  try{
    cachedWorkers = await apiGet("/api/workers");
    apiError = null;
  }catch(err){
    apiError = err.message;
    document.getElementById("app").innerHTML = `
      <div class="wrap" style="padding:70px 0">
        <div class="empty-state">
          <h3>Can't reach the server</h3>
          <p>Make sure the backend is running and API_BASE at the top of this file's script points to it.<br>(${err.message})</p>
        </div>
      </div>`;
    return;
  }
  paint();
}

window.addEventListener("hashchange", paint);
window.addEventListener("DOMContentLoaded", boot);

/* Register service worker so the app installs and works offline. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
